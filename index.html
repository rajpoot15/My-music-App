<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Music Player</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #1db954;
      --text: #ffffff;
      --subtext: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 180px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #333;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.search-btn {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .tag {
      background: var(--card);
      border: 1px solid #333;
      color: var(--subtext);
      padding: 8px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .status {
      text-align: center;
      color: var(--subtext);
      margin: 15px 0 20px;
      font-size: 0.9rem;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    .track-card.active {
      background: #18281e;
      border: 1px solid var(--primary);
    }

    .track-img {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.82rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #282828;
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto;
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-header img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-next {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    audio {
      width: 100%;
      height: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎵 My Music Player</h1>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search song or artist..." value="Karan Aujla" />
    <button class="search-btn" onclick="handleSearch()">Search</button>
  </div>

  <div class="tags">
    <div class="tag" onclick="quickSearch('Karan Aujla')">🎤 Karan Aujla</div>
    <div class="tag" onclick="quickSearch('Humsafar')">✨ Humsafar</div>
    <div class="tag" onclick="quickSearch('Shubh')">🔥 Shubh</div>
  </div>

  <div id="status" class="status">Initializing player...</div>

  <div id="trackList" class="track-list"></div>

  <div id="playerBar" class="player-bar">
    <div class="player-header">
      <img id="playerImg" src="" alt="Cover" />
      <div style="flex:1;">
        <div id="playerTitle" style="font-weight: bold; font-size: 0.9rem;"></div>
        <div id="playerArtist" style="color: var(--primary); font-size: 0.8rem;"></div>
      </div>
      <button class="btn-next" onclick="playNext()">Next ⏭</button>
    </div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    let currentPlaylist = [];
    let currentIndex = 0;

    const searchInput = document.getElementById('searchInput');
    const trackList = document.getElementById('trackList');
    const status = document.getElementById('status');
    const playerBar = document.getElementById('playerBar');
    const audioPlayer = document.getElementById('audioPlayer');
    const playerImg = document.getElementById('playerImg');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');

    // Automatically trigger next song when current track ends
    audioPlayer.addEventListener('ended', () => {
      playNext();
    });

    function quickSearch(query) {
      searchInput.value = query;
      handleSearch();
    }

    async function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      status.textContent = 'Searching...';
      trackList.innerHTML = '';

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=25`);
        const data = await res.json();

        if (data.results && data.results.length > 0) {
          currentPlaylist = data.results.map(item => ({
            title: item.trackName || 'Unknown Track',
            artist: item.artistName || 'Unknown Artist',
            image: item.artworkUrl100.replace('100x100bb', '300x300bb'),
            audio: item.previewUrl
          }));

          status.textContent = `Found ${currentPlaylist.length} tracks! Tap any to play:`;
          renderTracks();
        } else {
          status.textContent = 'No tracks found for this search.';
        }
      } catch (e) {
        status.textContent = 'Network error. Please check your connection.';
      }
    }

    function renderTracks() {
      trackList.innerHTML = '';
      currentPlaylist.forEach((song, index) => {
        const card = document.createElement('div');
        card.className = `track-card ${index === currentIndex ? 'active' : ''}`;
        
        card.innerHTML = `
          <img class="track-img" src="${song.image}" />
          <div class="track-info">
            <div class="track-title">${song.title}</div>
            <div class="track-artist">🎤 ${song.artist}</div>
          </div>
        `;

        card.onclick = () => {
          currentIndex = index;
          playSong(index);
        };

        trackList.appendChild(card);
      });
    }

    function playSong(index) {
      const song = currentPlaylist[index];
      if (!song) return;

      playerImg.src = song.image;
      playerTitle.textContent = song.title;
      playerArtist.textContent = song.artist;
      
      audioPlayer.src = song.audio;
      playerBar.style.display = 'flex';

      // Promise catch prevents mobile browser silence/crash
      audioPlayer.play().catch(e => console.log("Autoplay blocked:", e));
      renderTracks();
    }

    function playNext() {
      if (currentPlaylist.length === 0) return;
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      playSong(currentIndex);
    }

    handleSearch();
  </script>
</body>
</html>
