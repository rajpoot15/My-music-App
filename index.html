<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Music Player</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --card-active: #282828;
      --primary: #1db954;
      --text: #ffffff;
      --subtext: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 170px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #333;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.search-btn {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .tags::-webkit-scrollbar {
      display: none;
    }

    .tag {
      background: var(--card);
      border: 1px solid #333;
      color: var(--subtext);
      padding: 8px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tag:hover {
      border-color: var(--primary);
      color: var(--text);
    }

    .status {
      text-align: center;
      color: var(--subtext);
      margin: 15px 0 20px;
      font-size: 0.9rem;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .track-card:hover {
      background: var(--card-active);
    }

    .track-card.active {
      background: #18281e;
      border-color: var(--primary);
    }

    .track-card.active .track-title {
      color: var(--primary);
    }

    .track-img {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.82rem;
      color: var(--subtext);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-badge {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: bold;
    }

    /* Fixed Bottom Native Audio Player */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #282828;
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.8);
      z-index: 100;
      max-width: 600px;
      margin: 0 auto;
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-header img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
    }

    .player-title-box {
      flex: 1;
      overflow: hidden;
    }

    .player-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .player-artist {
      font-size: 0.78rem;
      color: var(--primary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎵 My Music Player</h1>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search song or artist..." value="Karan Aujla" />
    <button class="search-btn" onclick="handleSearch()">Search</button>
  </div>

  <div class="tags">
    <div class="tag" onclick="quickSearch('Karan Aujla')">🎤 Karan Aujla</div>
    <div class="tag" onclick="quickSearch('Humsafar')">✨ Humsafar</div>
    <div class="tag" onclick="quickSearch('Supreme Shubh')">🔥 Supreme - Shubh</div>
    <div class="tag" onclick="quickSearch('Faded Alan Walker')">🎧 Faded - Alan Walker</div>
  </div>

  <div id="status" class="status">Connecting to music engine...</div>

  <div id="trackList" class="track-list"></div>

  <!-- Bottom Native Audio Player -->
  <div id="playerBar" class="player-bar">
    <div class="player-header">
      <img id="playerImg" src="" alt="Cover" />
      <div class="player-title-box">
        <div id="playerTitle" class="player-title">Track Name</div>
        <div id="playerArtist" class="player-artist">Artist</div>
      </div>
    </div>
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <script>
    let currentPlaylist = [];
    let currentIndex = 0;

    const searchInput = document.getElementById('searchInput');
    const trackList = document.getElementById('trackList');
    const status = document.getElementById('status');
    const playerBar = document.getElementById('playerBar');
    const audioPlayer = document.getElementById('audioPlayer');
    const playerImg = document.getElementById('playerImg');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    audioPlayer.addEventListener('ended', () => {
      if (currentIndex + 1 < currentPlaylist.length) {
        currentIndex++;
        playSongAtIndex(currentIndex);
      }
    });

    function quickSearch(query) {
      searchInput.value = query;
      handleSearch();
    }

    async function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      status.textContent = 'Searching full tracks...';
      trackList.innerHTML = '';

      const songs = await fetchSongsWithFailover(query);

      if (songs && songs.length > 0) {
        currentPlaylist = songs;
        currentIndex = 0;
        status.textContent = `▶ Found ${songs.length} tracks. Tap any song to play full track:`;
        renderTracks();
      } else {
        status.textContent = 'No tracks found. Please try another search term.';
      }
    }

    // CORS Bypass Engine with Multiple Proxy Mirrors
    async function fetchSongsWithFailover(query) {
      const encodedQuery = encodeURIComponent(query);
      const targetUrl = `https://saavn.dev/api/search/songs?query=${encodedQuery}&limit=30`;

      // Endpoint list: Direct API -> CORS Proxies -> Alternative API
      const endpoints = [
        targetUrl,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
        `https://saavn.me/search/songs?query=${encodedQuery}&limit=30`
      ];

      for (const url of endpoints) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 3500);
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timeout);

          if (!res.ok) continue;
          
          let text = await res.text();
          let json = JSON.parse(text);
          let rawItems = json?.data?.results || json?.results || json?.data || [];

          if (Array.isArray(rawItems) && rawItems.length > 0) {
            const parsed = parseSaavnData(rawItems);
            if (parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.warn('Endpoint failed, trying proxy mirror:', url);
        }
      }

      return [];
    }

    function parseSaavnData(items) {
      return items.map(item => {
        // High quality artwork
        let imgUrl = '';
        if (Array.isArray(item.image)) {
          imgUrl = item.image[item.image.length - 1]?.url || item.image[0]?.url || '';
        } else if (typeof item.image === 'string') {
          imgUrl = item.image;
        }

        // Full 320kbps/160kbps MP3 stream URL
        let audioUrl = '';
        const dl = item.downloadUrl || item.download_url || item.media_url;
        if (Array.isArray(dl) && dl.length > 0) {
          const target = dl.find(d => d.quality === '320kbps') || 
                         dl.find(d => d.quality === '160kbps') || 
                         dl[dl.length - 1];
          audioUrl = target?.url || target?.link || (typeof target === 'string' ? target : '');
        } else if (typeof dl === 'string') {
          audioUrl = dl;
        }

        // Artist extraction
        let artistName = 'Artist';
        if (item.artists && Array.isArray(item.artists.primary) && item.artists.primary.length > 0) {
          artistName = item.artists.primary.map(a => a.name).join(', ');
        } else if (item.primaryArtists) {
          artistName = item.primaryArtists;
        } else if (item.artist) {
          artistName = item.artist;
        }

        return {
          id: item.id || Math.random().toString(),
          title: cleanHtmlEntities(item.name || item.title || 'Unknown Song'),
          artist: cleanHtmlEntities(artistName),
          image: imgUrl || 'https://via.placeholder.com/150',
          audio: audioUrl
        };
      }).filter(song => song.audio && song.audio.startsWith('http'));
    }

    function renderTracks() {
      trackList.innerHTML = '';
      currentPlaylist.forEach((song, index) => {
        const card = document.createElement('div');
        const isActive = index === currentIndex;
        card.className = `track-card ${isActive ? 'active' : ''}`;
        
        card.innerHTML = `
          <img class="track-img" src="${song.image}" alt="${song.title}" />
          <div class="track-info">
            <div class="track-title">${escapeHtml(song.title)}</div>
            <div class="track-artist">👤 ${escapeHtml(song.artist)}</div>
          </div>
          <div class="play-badge">${isActive ? '🔊 PLAYING' : '▶'}</div>
        `;

        card.onclick = () => {
          currentIndex = index;
          playSongAtIndex(currentIndex);
        };

        trackList.appendChild(card);
      });
    }

    function playSongAtIndex(index) {
      const song = currentPlaylist[index];
      if (!song) return;

      playerImg.src = song.image;
      playerTitle.textContent = song.title;
      playerArtist.textContent = `🎤 ${song.artist}`;
      
      audioPlayer.src = song.audio;
      playerBar.style.display = 'flex';

      audioPlayer.play().catch(err => console.log('Autoplay handled:', err));
      renderTracks();
    }

    function cleanHtmlEntities(str) {
      if (!str) return '';
      const parser = new DOMParser();
      return parser.parseFromString(str, 'text/html').body.textContent || str;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Auto search on page load
    handleSearch();
  </script>
</body>
</html>
