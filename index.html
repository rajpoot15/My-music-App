<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Player</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .title {
      color: #10b981;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Search Bar Layout */
    .search-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-btn {
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      background-color: #10b981;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* Recently Searched Chips Section */
    .recent-section {
      width: 100%;
      max-width: 450px;
      margin-bottom: 10px;
    }

    .recent-title {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .recent-tags {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 8px;
    }

    .recent-chip {
      background-color: #242424;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s;
    }

    .recent-chip:hover {
      background-color: #333333;
    }

    .status-msg {
      margin: 15px 0 10px 0;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
    }

    /* Song Results Container */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 450px;
    }

    .song-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #2a2a2a;
    }

    .song-title {
      font-weight: bold;
      font-size: 15px;
      color: #10b981;
    }

    .youtube-player {
      width: 100%;
      height: 220px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="title">🎵 My Music Player</div>

  <!-- Search Input and Button -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search singer or song...">
    <button id="searchBtn" class="search-btn">Search</button>
  </div>

  <!-- Dynamic Recently Searched Chips Container -->
  <div class="recent-section" id="recentSection" style="display: none;">
    <div class="recent-title">Recently Searched</div>
    <div class="recent-tags" id="recentTagsContainer"></div>
  </div>

  <!-- Status Message -->
  <div id="statusMsg" class="status-msg">Search a song or singer to play</div>

  <!-- Results Area -->
  <div id="resultsContainer" class="results-container"></div>

  <script>
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const statusMsg = document.getElementById("statusMsg");
    const resultsContainer = document.getElementById("resultsContainer");
    const recentSection = document.getElementById("recentSection");
    const recentTagsContainer = document.getElementById("recentTagsContainer");

    // Load recent searches from Browser Storage
    function getRecentSearches() {
      const recents = localStorage.getItem("recentSearches");
      return recents ? JSON.parse(recents) : [];
    }

    // Save new search query to Browser Storage
    function saveRecentSearch(query) {
      if (!query.trim()) return;
      let recents = getRecentSearches();

      // Remove duplicates (case insensitive)
      recents = recents.filter(item => item.toLowerCase() !== query.toLowerCase());

      // Add new search to the beginning
      recents.unshift(query);

      // Keep only top 5 recent searches
      if (recents.length > 5) {
        recents = recents.slice(0, 5);
      }

      localStorage.setItem("recentSearches", JSON.stringify(recents));
      renderRecentChips();
    }

    // Render Recent Search Chips
    function renderRecentChips() {
      const recents = getRecentSearches();
      if (recents.length === 0) {
        recentSection.style.display = "none";
        return;
      }

      recentSection.style.display = "block";
      recentTagsContainer.innerHTML = "";

      recents.forEach(query => {
        const chip = document.createElement("button");
        chip.className = "recent-chip";
        chip.textContent = `🕒 ${query}`;
        chip.addEventListener("click", () => {
          searchInput.value = query;
          searchSongs(query);
        });
        recentTagsContainer.appendChild(chip);
      });
    }

    // YouTube Search & Play Function
    async function searchSongs(query) {
      if (!query.trim()) return;

      // Save to recent list automatically
      saveRecentSearch(query);

      statusMsg.textContent = `Searching YouTube for "${query}"...`;
      resultsContainer.innerHTML = "";

      try {
        const response = await fetch(`https://inv.tux.pizza/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
        const data = await response.json();

        if (!data || data.length === 0) {
          statusMsg.textContent = `No YouTube songs found for "${query}"`;
          return;
        }

        statusMsg.textContent = `Results for "${query}":`;

        data.slice(0, 5).forEach(video => {
          const videoId = video.videoId;
          const title = video.title;

          const songCard = document.createElement("div");
          songCard.className = "song-card";

          songCard.innerHTML = `
            <div class="song-title">▶ ${title}</div>
            <iframe 
              class="youtube-player" 
              src="https://www.youtube-nocookie.com/embed/${videoId}" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          `;

          resultsContainer.appendChild(songCard);
        });

      } catch (error) {
        console.error(error);
        statusMsg.textContent = `Showing YouTube results for "${query}":`;
        
        const fallbackCard = document.createElement("div");
        fallbackCard.className = "song-card";
        fallbackCard.innerHTML = `
          <div class="song-title">▶ Full Songs Playlist for ${query}</div>
          <iframe 
            class="youtube-player" 
            src="https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(query)}" 
            allowfullscreen>
          </iframe>
        `;
        resultsContainer.appendChild(fallbackCard);
      }
    }

    // Load recent chips on page start
    renderRecentChips();

    // Search Button Click Event
    searchBtn.addEventListener("click", () => {
      searchSongs(searchInput.value);
    });

    // Keyboard Enter Press Event
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        searchSongs(searchInput.value);
      }
    });
  </script>

</body>
</html>
