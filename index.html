<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Player</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .title {
      color: #10b981;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Search Bar */
    .search-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-btn {
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      background-color: #10b981;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* Singer Chips */
    .singer-tags {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      width: 100%;
      max-width: 450px;
      padding-bottom: 10px;
    }

    .singer-chip {
      background-color: #242424;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s;
    }

    .singer-chip:hover {
      background-color: #333333;
    }

    .status-msg {
      margin: 20px 0 10px 0;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
    }

    /* Song Results Container */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 450px;
    }

    /* YouTube Card Style */
    .song-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #2a2a2a;
    }

    .song-title {
      font-weight: bold;
      font-size: 15px;
      color: #10b981;
    }

    .youtube-player {
      width: 100%;
      height: 220px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="title">🎵 My Music Player</div>

  <!-- Search Input and Button -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search singer or song...">
    <button id="searchBtn" class="search-btn">Search</button>
  </div>

  <!-- Top Singer Chips -->
  <div class="singer-tags">
    <button class="singer-chip" data-artist="Shubh">🔥 Shubh</button>
    <button class="singer-chip" data-artist="Alan Walker">🎧 Alan Walker</button>
    <button class="singer-chip" data-artist="Arijit Singh">🎤 Arijit Singh</button>
    <button class="singer-chip" data-artist="Karan Aujla">👑 Karan Aujla</button>
  </div>

  <!-- Status Message -->
  <div id="statusMsg" class="status-msg">Click a singer or search to play songs</div>

  <!-- Results Area -->
  <div id="resultsContainer" class="results-container"></div>

  <script>
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const statusMsg = document.getElementById("statusMsg");
    const resultsContainer = document.getElementById("resultsContainer");
    const singerChips = document.querySelectorAll(".singer-chip");

    // YouTube Search & Play Function
    async function searchSongs(query) {
      if (!query.trim()) return;

      statusMsg.textContent = `Searching YouTube for "${query}"...`;
      resultsContainer.innerHTML = "";

      try {
        // Fetching search results from Invidious (YouTube Proxy API)
        const response = await fetch(`https://inv.tux.pizza/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
        const data = await response.json();

        if (!data || data.length === 0) {
          statusMsg.textContent = `No YouTube songs found for "${query}"`;
          return;
        }

        statusMsg.textContent = `Top YouTube songs for "${query}":`;

        // Display top 5 YouTube results
        data.slice(0, 5).forEach(video => {
          const videoId = video.videoId;
          const title = video.title;

          const songCard = document.createElement("div");
          songCard.className = "song-card";

          songCard.innerHTML = `
            <div class="song-title">▶ ${title}</div>
            <iframe 
              class="youtube-player" 
              src="https://www.youtube-nocookie.com/embed/${videoId}" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          `;

          resultsContainer.appendChild(songCard);
        });

      } catch (error) {
        console.error(error);
        // Fallback: Direct YouTube Embed if API server is busy
        statusMsg.textContent = `Showing YouTube results for "${query}":`;
        
        const fallbackCard = document.createElement("div");
        fallbackCard.className = "song-card";
        fallbackCard.innerHTML = `
          <div class="song-title">▶ Full Songs Playlist for ${query}</div>
          <iframe 
            class="youtube-player" 
            src="https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(query)}" 
            allowfullscreen>
          </iframe>
        `;
        resultsContainer.appendChild(fallbackCard);
      }
    }

    // Singer Chip Click Event
    singerChips.forEach(chip => {
      chip.addEventListener("click", () => {
        const artistName = chip.getAttribute("data-artist");
        searchInput.value = artistName;
        searchSongs(artistName);
      });
    });

    // Search Button Click Event
    searchBtn.addEventListener("click", () => {
      searchSongs(searchInput.value);
    });

    // Keyboard Enter Press Event
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        searchSongs(searchInput.value);
      }
    });
  </script>

</body>
</html>
