<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Music Player</title>
  <style>
    :root { --bg:#121212; --card:#1e1e1e; --primary:#1db954; --text:#fff; --subtext:#b3b3b3; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:var(--bg); color:var(--text); padding:16px; padding-bottom:320px; max-width:600px; margin:0 auto; }
    header { text-align:center; margin-bottom:18px; }
    h1 { color:var(--primary); font-size:1.8rem; }
    .search-box { display:flex; gap:10px; margin-bottom:14px; }
    input[type="text"] { flex:1; padding:12px 16px; border-radius:25px; border:1px solid #333; background:var(--card); color:var(--text); font-size:1rem; outline:none; }
    input[type="text"]:focus { border-color:var(--primary); }
    button.search-btn { padding:12px 20px; border-radius:25px; border:none; background:var(--primary); color:#000; font-weight:bold; font-size:1rem; cursor:pointer; }
    .tags { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; scrollbar-width:none; }
    .tag { background:var(--card); border:1px solid #333; color:var(--subtext); padding:8px 14px; border-radius:20px; white-space:nowrap; font-size:.85rem; cursor:pointer; }
    .status { text-align:center; color:var(--subtext); margin:15px 0 20px; font-size:.9rem; }
    .track-list { display:flex; flex-direction:column; gap:10px; }
    .track-card { display:flex; align-items:center; gap:12px; background:var(--card); padding:10px 14px; border-radius:12px; cursor:pointer; border:1px solid transparent; }
    .track-card.active { background:#18281e; border-color:var(--primary); }
    .track-img { width:54px; height:54px; border-radius:8px; object-fit:cover; }
    .track-info { flex:1; overflow:hidden; }
    .track-title { font-size:.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .track-artist { font-size:.82rem; color:var(--subtext); margin-top:4px; }

    .player-bar { position:fixed; bottom:0; left:0; right:0; background:#181818; border-top:1px solid #282828; padding:12px 16px; display:none; flex-direction:column; gap:10px; max-width:600px; margin:0 auto; }
    .player-header { display:flex; align-items:center; gap:12px; }
    .player-header img { width:48px; height:48px; border-radius:6px; }
    .btn { background:var(--primary); color:#000; border:none; padding:6px 14px; border-radius:15px; font-weight:bold; cursor:pointer; }
    .btn.alt { background:#333; color:#fff; }
    .yt-wrap { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
    .yt-wrap iframe, .yt-wrap > div { position:absolute; inset:0; width:100%; height:100%; }
  </style>
</head>
<body>

  <header><h1>🎵 My Music Player</h1></header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search song or artist..." value="Karan Aujla" />
    <button class="search-btn" onclick="handleSearch()">Search</button>
  </div>

  <div class="tags">
    <div class="tag" onclick="quickSearch('Karan Aujla')">🎤 Karan Aujla</div>
    <div class="tag" onclick="quickSearch('Humsafar')">✨ Humsafar</div>
    <div class="tag" onclick="quickSearch('Shubh')">🔥 Shubh</div>
  </div>

  <div id="status" class="status">Initializing player...</div>
  <div id="trackList" class="track-list"></div>

  <div id="playerBar" class="player-bar">
    <div class="player-header">
      <img id="playerImg" src="" alt="Cover" />
      <div style="flex:1; min-width:0;">
        <div id="playerTitle" style="font-weight:bold; font-size:.9rem;"></div>
        <div id="playerArtist" style="color:var(--primary); font-size:.8rem;"></div>
      </div>
      <button class="btn alt" onclick="playPrev()">⏮</button>
      <button class="btn" onclick="playNext()">Next ⏭</button>
    </div>
    <div class="yt-wrap"><div id="ytPlayer"></div></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ====== 1. Yahan apni YouTube Data API v3 key daalo ======
    const YT_API_KEY = 'AIzaSyBNe9Fgjs_5uJYiIrutVXsTzdzTZ5hoEsk';

    let currentPlaylist = [];
    let currentIndex = 0;
    let ytPlayer = null;
    let ytReady = false;
    let pendingPlay = null;
    let retryList = [];      // ek song ke baaki YouTube results (fallback ke liye)

    const $ = id => document.getElementById(id);
    const searchInput = $('searchInput'), trackList = $('trackList'), status = $('status');
    const playerBar = $('playerBar'), playerImg = $('playerImg');
    const playerTitle = $('playerTitle'), playerArtist = $('playerArtist');

    // Safe text (XSS se bachne ke liye)
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // ====== YouTube player setup ======
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayer', {
        width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => { ytReady = true; if (pendingPlay !== null) playSong(pendingPlay); },
          onStateChange: e => { if (e.data === YT.PlayerState.ENDED) playNext(); },
          // 2, 5, 100, 101, 150 = video unavailable / embed blocked -> agla result try karo
          onError: () => tryNextCandidate()
        }
      });
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    // ====== YouTube search (with cache taaki quota bache) ======
    async function findVideoIds(song) {
      const key = 'yt:' + song.title + '|' + song.artist;
      try {
        const cached = JSON.parse(localStorage.getItem(key) || 'null');
        if (cached && cached.length) return cached;
      } catch (e) {}

      const q = `${song.title} ${song.artist} official audio`;
      const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video'
        + '&videoEmbeddable=true&maxResults=5&videoCategoryId=10'
        + '&q=' + encodeURIComponent(q) + '&key=' + YT_API_KEY;

      const res = await fetch(url);
      if (!res.ok) throw new Error('YouTube API error ' + res.status);
      const data = await res.json();
      const ids = (data.items || []).map(i => i.id.videoId);
      try { localStorage.setItem(key, JSON.stringify(ids)); } catch (e) {}
      return ids;
    }

    // ====== iTunes search (cover, title, artist ke liye) ======
    function quickSearch(q) { searchInput.value = q; handleSearch(); }

    async function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;
      status.textContent = 'Searching...';
      trackList.innerHTML = '';
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=25`);
        const data = await res.json();
        if (data.results && data.results.length) {
          currentPlaylist = data.results.map(item => ({
            title: item.trackName || 'Unknown Track',
            artist: item.artistName || 'Unknown Artist',
            image: (item.artworkUrl100 || '').replace('100x100bb', '300x300bb')
          }));
          currentIndex = -1;
          status.textContent = `Found ${currentPlaylist.length} tracks! Tap any to play:`;
          renderTracks();
        } else {
          status.textContent = 'No tracks found for this search.';
        }
      } catch (e) {
        status.textContent = 'Network error. Please check your connection.';
      }
    }

    function renderTracks() {
      trackList.innerHTML = '';
      currentPlaylist.forEach((song, index) => {
        const card = document.createElement('div');
        card.className = 'track-card' + (index === currentIndex ? ' active' : '');
        card.innerHTML = `
          <img class="track-img" src="${esc(song.image)}" alt="" />
          <div class="track-info">
            <div class="track-title">${esc(song.title)}</div>
            <div class="track-artist">🎤 ${esc(song.artist)}</div>
          </div>`;
        card.onclick = () => playSong(index);
        trackList.appendChild(card);
      });
    }

    // ====== Playback ======
    async function playSong(index) {
      const song = currentPlaylist[index];
      if (!song) return;
      currentIndex = index;

      playerImg.src = song.image;
      playerTitle.textContent = song.title;
      playerArtist.textContent = song.artist;
      playerBar.style.display = 'flex';
      renderTracks();

      if (!ytReady) { pendingPlay = index; status.textContent = 'Loading player...'; return; }
      pendingPlay = null;

      if (YT_API_KEY.startsWith('YAHAN')) {
        status.textContent = 'Pehle code mein YouTube API key daalo.';
        return;
      }

      try {
        status.textContent = 'Loading full song...';
        retryList = await findVideoIds(song);
        tryNextCandidate();
      } catch (e) {
        status.textContent = 'YouTube search fail hua (API key ya quota check karo).';
        console.error(e);
      }
    }

    function tryNextCandidate() {
      const id = retryList.shift();
      if (!id) {
        status.textContent = 'Ye song embed nahi ho sakta. Next song chal raha hai...';
        setTimeout(playNext, 1200);
        return;
      }
      status.textContent = 'Now playing';
      ytPlayer.loadVideoById(id);
    }

    function playNext() {
      if (!currentPlaylist.length) return;
      playSong((currentIndex + 1) % currentPlaylist.length);
    }
    function playPrev() {
      if (!currentPlaylist.length) return;
      playSong((currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length);
    }

    handleSearch();
  </script>
</body>
</html>
