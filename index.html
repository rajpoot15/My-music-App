<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Music Player</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --card-active: #282828;
      --primary: #1db954;
      --text: #ffffff;
      --subtext: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 220px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #333;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.search-btn {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .tags::-webkit-scrollbar {
      display: none;
    }

    .tag {
      background: var(--card);
      border: 1px solid #333;
      color: var(--subtext);
      padding: 8px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tag:hover {
      border-color: var(--primary);
      color: var(--text);
    }

    .status {
      text-align: center;
      color: var(--subtext);
      margin: 15px 0 20px;
      font-size: 0.9rem;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .track-card:hover {
      background: var(--card-active);
    }

    .track-card.active {
      background: #18281e;
      border-color: var(--primary);
    }

    .track-card.active .track-title {
      color: var(--primary);
    }

    .track-img {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.82rem;
      color: var(--subtext);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-badge {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: bold;
    }

    /* Fixed Bottom Player for YouTube */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #282828;
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.8);
      z-index: 100;
      max-width: 600px;
      margin: 0 auto;
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-header img {
      width: 46px;
      height: 46px;
      border-radius: 6px;
      object-fit: cover;
    }

    .player-title-box {
      flex: 1;
      overflow: hidden;
    }

    .player-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .player-artist {
      font-size: 0.78rem;
      color: var(--primary);
      margin-top: 2px;
    }

    .iframe-wrapper {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎵 My Music Player</h1>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search YouTube music..." value="Karan Aujla" />
    <button class="search-btn" onclick="handleSearch()">Search</button>
  </div>

  <div class="tags">
    <div class="tag" onclick="quickSearch('Karan Aujla')">🎤 Karan Aujla</div>
    <div class="tag" onclick="quickSearch('Supreme Shubh')">🔥 Supreme - Shubh</div>
    <div class="tag" onclick="quickSearch('Faded Alan Walker')">🎧 Faded - Alan Walker</div>
    <div class="tag" onclick="quickSearch('Sidhu Moosewala')">👑 Sidhu Moosewala</div>
  </div>

  <div id="status" class="status">Type a song and hit search.</div>

  <div id="trackList" class="track-list"></div>

  <!-- Bottom YouTube Player -->
  <div id="playerBar" class="player-bar">
    <div class="player-header">
      <img id="playerImg" src="" alt="Cover" />
      <div class="player-title-box">
        <div id="playerTitle" class="player-title">Track Name</div>
        <div id="playerArtist" class="player-artist">🎤 Playing from YouTube</div>
      </div>
    </div>
    <div class="iframe-wrapper">
      <iframe id="ytPlayer" allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>

  <script>
    let currentPlaylist = [];
    let currentIndex = 0;

    const searchInput = document.getElementById('searchInput');
    const trackList = document.getElementById('trackList');
    const status = document.getElementById('status');
    const playerBar = document.getElementById('playerBar');
    const ytPlayer = document.getElementById('ytPlayer');
    const playerImg = document.getElementById('playerImg');
    const playerTitle = document.getElementById('playerTitle');

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    function quickSearch(query) {
      searchInput.value = query;
      handleSearch();
    }

    async function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      status.textContent = 'Searching YouTube...';
      trackList.innerHTML = '';

      const songs = await fetchYouTubeSongs(query);

      if (songs && songs.length > 0) {
        currentPlaylist = songs;
        currentIndex = 0;
        status.textContent = `▶ Found ${songs.length} YouTube tracks. Tap any track to play:`;
        renderTracks();
      } else {
        status.textContent = 'No tracks found. Try searching another song name.';
      }
    }

    // High-Reliability YouTube Search Engine
    async function fetchYouTubeSongs(query) {
      const cleanQuery = encodeURIComponent(query + ' song');
      
      const servers = [
        `https://inv.hostux.net/api/v1/search?q=${cleanQuery}&type=video`,
        `https://invidious.nerdvpn.de/api/v1/search?q=${cleanQuery}&type=video`,
        `https://vid.puffyan.us/api/v1/search?q=${cleanQuery}&type=video`,
        `https://invidious.drgns.space/api/v1/search?q=${cleanQuery}&type=video`
      ];

      for (const url of servers) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 3000);
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timeout);

          if (!res.ok) continue;
          const items = await res.json();

          if (Array.isArray(items) && items.length > 0) {
            return items.map(item => ({
              id: item.videoId,
              title: item.title,
              artist: item.author || 'YouTube Music',
              image: item.videoThumbnails?.find(t => t.quality === 'medium')?.url || `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`
            })).filter(s => s.id);
          }
        } catch (e) {
          console.warn('YouTube server timeout, trying backup mirror...');
        }
      }

      return [];
    }

    function renderTracks() {
      trackList.innerHTML = '';
      currentPlaylist.forEach((song, index) => {
        const card = document.createElement('div');
        const isActive = index === currentIndex;
        card.className = `track-card ${isActive ? 'active' : ''}`;
        
        card.innerHTML = `
          <img class="track-img" src="${song.image}" alt="${song.title}" />
          <div class="track-info">
            <div class="track-title">${escapeHtml(song.title)}</div>
            <div class="track-artist">👤 ${escapeHtml(song.artist)}</div>
          </div>
          <div class="play-badge">${isActive ? '🔊 PLAYING' : '▶'}</div>
        `;

        card.onclick = () => {
          currentIndex = index;
          playSongAtIndex(currentIndex);
        };

        trackList.appendChild(card);
      });
    }

    function playSongAtIndex(index) {
      const song = currentPlaylist[index];
      if (!song) return;

      playerImg.src = song.image;
      playerTitle.textContent = song.title;
      
      // Embed YouTube Player with Autoplay
      ytPlayer.src = `https://www.youtube-nocookie.com/embed/${song.id}?autoplay=1&enablejsapi=1`;
      playerBar.style.display = 'flex';

      renderTracks();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Initial Search on Load
    handleSearch();
  </script>
</body>
</html>
