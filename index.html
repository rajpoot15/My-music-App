<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Player</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .title {
      color: #10b981;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Search Bar Layout */
    .search-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-btn {
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      background-color: #10b981;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* Recently Searched Chips Section */
    .recent-section {
      width: 100%;
      max-width: 450px;
      margin-bottom: 15px;
    }

    .recent-title {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .recent-tags {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 8px;
    }

    .recent-chip {
      background-color: #242424;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s;
    }

    .recent-chip:hover {
      background-color: #333333;
    }

    .status-msg {
      margin: 10px 0 15px 0;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
    }

    /* Song Results Container */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 450px;
    }

    .song-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #2a2a2a;
    }

    .song-title {
      font-weight: bold;
      font-size: 16px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .youtube-player {
      width: 100%;
      height: 230px;
      border: none;
      border-radius: 8px;
      background-color: #000;
    }
  </style>
</head>
<body>

  <div class="title">🎵 My Music Player</div>

  <!-- Search Input and Button -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search singer or song...">
    <button id="searchBtn" class="search-btn">Search</button>
  </div>

  <!-- Dynamic Recently Searched Chips -->
  <div class="recent-section" id="recentSection" style="display: none;">
    <div class="recent-title">Recently Searched</div>
    <div class="recent-tags" id="recentTagsContainer"></div>
  </div>

  <!-- Status Message -->
  <div id="statusMsg" class="status-msg">Search a song or singer to play</div>

  <!-- Results Area -->
  <div id="resultsContainer" class="results-container"></div>

  <script>
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const statusMsg = document.getElementById("statusMsg");
    const resultsContainer = document.getElementById("resultsContainer");
    const recentSection = document.getElementById("recentSection");
    const recentTagsContainer = document.getElementById("recentTagsContainer");

    // Load recent searches from Local Storage
    function getRecentSearches() {
      const recents = localStorage.getItem("recentSearches");
      return recents ? JSON.parse(recents) : [];
    }

    // Save new search query
    function saveRecentSearch(query) {
      if (!query.trim()) return;
      let recents = getRecentSearches();

      // Remove duplicates
      recents = recents.filter(item => item.toLowerCase() !== query.toLowerCase());

      // Add to start
      recents.unshift(query);

      // Keep maximum 5 items
      if (recents.length > 5) {
        recents = recents.slice(0, 5);
      }

      localStorage.setItem("recentSearches", JSON.stringify(recents));
      renderRecentChips();
    }

    // Render Recent Search Chips
    function renderRecentChips() {
      const recents = getRecentSearches();
      if (recents.length === 0) {
        recentSection.style.display = "none";
        return;
      }

      recentSection.style.display = "block";
      recentTagsContainer.innerHTML = "";

      recents.forEach(query => {
        const chip = document.createElement("button");
        chip.className = "recent-chip";
        chip.textContent = `🕒 ${query}`;
        chip.addEventListener("click", () => {
          searchInput.value = query;
          playSong(query);
        });
        recentTagsContainer.appendChild(chip);
      });
    }

    // Direct Instant YouTube Search & Play Function
    function playSong(query) {
      if (!query.trim()) return;

      saveRecentSearch(query);

      statusMsg.textContent = `Playing results for "${query}"`;
      resultsContainer.innerHTML = "";

      const songCard = document.createElement("div");
      songCard.className = "song-card";

      // Direct Embed URL (No API call required)
      const embedUrl = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(query)}`;

      songCard.innerHTML = `
        <div class="song-title">▶ ${query}</div>
        <iframe 
          class="youtube-player" 
          src="${embedUrl}" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      `;

      resultsContainer.appendChild(songCard);
    }

    // Load chips on startup
    renderRecentChips();

    // Event Listeners
    searchBtn.addEventListener("click", () => {
      playSong(searchInput.value);
    });

    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        playSong(searchInput.value);
      }
    });
  </script>

</body>
</html>
