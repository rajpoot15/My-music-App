<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Player</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .title {
      color: #10b981;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Search Bar Layout */
    .search-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-btn {
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      background-color: #10b981;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* Top Singer Tags */
    .singer-tags {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      width: 100%;
      max-width: 450px;
      padding-bottom: 10px;
    }

    .singer-chip {
      background-color: #242424;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s;
    }

    .singer-chip:hover {
      background-color: #333333;
    }

    .status-msg {
      margin: 20px 0 10px 0;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
    }

    /* Song Results Container */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 450px;
    }

    /* Individual Song Card */
    .song-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid #2a2a2a;
    }

    .song-card img {
      width: 55px;
      height: 55px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .song-title {
      font-weight: bold;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 13px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    audio {
      width: 100%;
      height: 32px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="title">🎵 My Music Player</div>

  <!-- Search Input and Button -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search singer or song...">
    <button id="searchBtn" class="search-btn">Search</button>
  </div>

  <!-- Top Singer Chips -->
  <div class="singer-tags">
    <button class="singer-chip" data-artist="Shubh">🔥 Shubh</button>
    <button class="singer-chip" data-artist="Alan Walker">🎧 Alan Walker</button>
    <button class="singer-chip" data-artist="Arijit Singh">🎤 Arijit Singh</button>
    <button class="singer-chip" data-artist="Karan Aujla">👑 Karan Aujla</button>
  </div>

  <!-- Status Message -->
  <div id="statusMsg" class="status-msg">Click a singer or search to play full songs</div>

  <!-- Results List -->
  <div id="resultsContainer" class="results-container"></div>

  <script>
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const statusMsg = document.getElementById("statusMsg");
    const resultsContainer = document.getElementById("resultsContainer");
    const singerChips = document.querySelectorAll(".singer-chip");

    // Clean up HTML encoding in track titles
    function decodeHTML(text) {
      const txt = document.createElement("textarea");
      txt.innerHTML = text;
      return txt.value;
    }

    // Search Function using JioSaavn API for FULL songs
    async function searchSongs(query) {
      if (!query.trim()) return;

      statusMsg.textContent = `Searching full songs for "${query}"...`;
      resultsContainer.innerHTML = "";

      try {
        const response = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}`);
        const data = await response.json();

        const songs = data.data && data.data.results ? data.data.results : [];

        if (songs.length === 0) {
          statusMsg.textContent = `No songs found for "${query}"`;
          return;
        }

        statusMsg.textContent = `Full songs for "${query}":`;

        songs.forEach(song => {
          // Select highest available audio quality (320kbps or fallback)
          let audioUrl = "";
          if (song.downloadUrl && song.downloadUrl.length > 0) {
            const bestAudio = song.downloadUrl.find(d => d.quality === "320kbps") || 
                              song.downloadUrl.find(d => d.quality === "160kbps") || 
                              song.downloadUrl[song.downloadUrl.length - 1];
            audioUrl = bestAudio ? (bestAudio.url || bestAudio.link) : "";
          }

          // Select album artwork
          let imageUrl = "https://via.placeholder.com/150";
          if (song.image && song.image.length > 0) {
            const bestImage = song.image.find(i => i.quality === "150x150") || 
                              song.image.find(i => i.quality === "500x500") || 
                              song.image[song.image.length - 1];
            imageUrl = bestImage ? (bestImage.url || bestImage.link) : imageUrl;
          }

          const trackName = decodeHTML(song.name || "Unknown Song");
          const artistName = decodeHTML(song.primaryArtists || "Unknown Artist");

          if (audioUrl) {
            const songCard = document.createElement("div");
            songCard.className = "song-card";

            songCard.innerHTML = `
              <img src="${imageUrl}" alt="${trackName}">
              <div class="song-details">
                <div class="song-title">${trackName}</div>
                <div class="song-artist">${artistName}</div>
                <audio controls src="${audioUrl}"></audio>
              </div>
            `;

            resultsContainer.appendChild(songCard);
          }
        });

      } catch (error) {
        console.error(error);
        statusMsg.textContent = "Failed to load songs. Please check your internet connection.";
      }
    }

    // Handle Singer Tag Clicks
    singerChips.forEach(chip => {
      chip.addEventListener("click", () => {
        const artistName = chip.getAttribute("data-artist");
        searchInput.value = artistName;
        searchSongs(artistName);
      });
    });

    // Handle Search Button Click
    searchBtn.addEventListener("click", () => {
      searchSongs(searchInput.value);
    });

    // Handle Enter Key Press
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        searchSongs(searchInput.value);
      }
    });
  </script>

</body>
</html>
