<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Music Player</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --card-active: #282828;
      --primary: #1db954;
      --text: #ffffff;
      --subtext: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 130px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #333;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.search-btn {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .tags::-webkit-scrollbar {
      display: none;
    }

    .tag {
      background: var(--card);
      border: 1px solid #333;
      color: var(--subtext);
      padding: 8px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tag:hover {
      border-color: var(--primary);
      color: var(--text);
    }

    .status {
      text-align: center;
      color: var(--subtext);
      margin: 15px 0 20px;
      font-size: 0.9rem;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .track-card:hover {
      background: var(--card-active);
    }

    /* Highlight currently playing song */
    .track-card.active {
      background: #18281e;
      border-color: var(--primary);
    }

    .track-card.active .track-title {
      color: var(--primary);
    }

    .track-img {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-badge {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: bold;
    }

    /* Sticky Bottom Player */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #282828;
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.7);
      z-index: 100;
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-header img {
      width: 46px;
      height: 46px;
      border-radius: 6px;
      object-fit: cover;
    }

    .player-title-box {
      flex: 1;
      overflow: hidden;
    }

    .player-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .player-artist {
      font-size: 0.75rem;
      color: var(--primary);
      margin-top: 2px;
    }

    audio {
      width: 100%;
      height: 36px;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎵 My Music Player</h1>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search song or artist..." value="Supreme Shubh" />
    <button class="search-btn" onclick="handleSearch()">Search</button>
  </div>

  <div class="tags">
    <div class="tag" onclick="quickSearch('Supreme Shubh')">🔥 Supreme - Shubh</div>
    <div class="tag" onclick="quickSearch('Karan Aujla')">🎤 Karan Aujla</div>
    <div class="tag" onclick="quickSearch('Sidhu Moosewala')">👑 Sidhu Moosewala</div>
    <div class="tag" onclick="quickSearch('Softly Ikky')">🎶 Softly - Karan Aujla</div>
  </div>

  <div id="status" class="status">Tap search or select a tag to start your playlist.</div>

  <div id="trackList" class="track-list"></div>

  <!-- Bottom Player -->
  <div id="playerBar" class="player-bar">
    <div class="player-header">
      <img id="playerImg" src="" alt="Cover" />
      <div class="player-title-box">
        <div id="playerTitle" class="player-title">Track Name</div>
        <div id="playerArtist" class="player-artist">Artist</div>
      </div>
    </div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    // State management
    let currentPlaylist = [];
    let currentIndex = 0;
    let isFetchingRecommendations = false;

    const searchInput = document.getElementById('searchInput');
    const trackList = document.getElementById('trackList');
    const status = document.getElementById('status');
    const playerBar = document.getElementById('playerBar');
    const audioPlayer = document.getElementById('audioPlayer');
    const playerImg = document.getElementById('playerImg');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');

    // Handle Enter keypress
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    // 1. AUTO-PLAY NEXT TRACK WHEN CURRENT SONG ENDS
    audioPlayer.addEventListener('ended', async () => {
      if (currentIndex + 1 < currentPlaylist.length) {
        // Play next song in queue
        currentIndex++;
        playSongAtIndex(currentIndex);
      } else {
        // Reached end of current list -> Auto-generate "Milte Julte Songs" (Spotify Radio)
        status.textContent = '✨ Generating similar songs for autoplay...';
        await loadSimilarSongs(currentPlaylist[currentIndex]);
        
        if (currentIndex + 1 < currentPlaylist.length) {
          currentIndex++;
          playSongAtIndex(currentIndex);
        } else {
          status.textContent = 'Playlist completed.';
        }
      }
    });

    function quickSearch(query) {
      searchInput.value = query;
      handleSearch();
    }

    async function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      status.textContent = 'Searching network servers...';
      trackList.innerHTML = '';

      const songs = await fetchSongs(query);

      if (songs && songs.length > 0) {
        currentPlaylist = songs;
        currentIndex = 0;
        status.textContent = `▶ Loaded ${songs.length} tracks. Tap any track to play:`;
        renderTracks();
      } else {
        status.textContent = 'No tracks found. Try another search.';
      }
    }

    // Multi-Server API Fetcher
    async function fetchSongs(query) {
      const endpoints = [
        `https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}`,
        `https://saavn.sumit.co/api/search/songs?query=${encodeURIComponent(query)}`
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const json = await res.json();
          const items = json?.data?.results || json?.results || [];

          if (items.length > 0) {
            return formatSongsData(items);
          }
        } catch (e) {
          console.warn('API Endpoint failed, trying next...', e);
        }
      }

      // iTunes Fallback
      try {
        const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=15`);
        if (itunesRes.ok) {
          const itunesData = await itunesRes.json();
          if (itunesData.results && itunesData.results.length > 0) {
            return itunesData.results.map(item => ({
              id: item.trackId,
              title: item.trackName,
              artist: item.artistName,
              image: item.artworkUrl100?.replace('100x100bb', '300x300bb') || '',
              audio: item.previewUrl
            }));
          }
        }
      } catch (e) {}

      return [];
    }

    // 2. SPOTIFY-LIKE "MILTE JULTE SONG" RECOMMENDATION GENERATOR
    async function loadSimilarSongs(currentSong) {
      if (isFetchingRecommendations || !currentSong) return;
      isFetchingRecommendations = true;

      try {
        // Try song recommendations API by Song ID
        if (currentSong.id) {
          const recUrl = `https://saavn.dev/api/songs/${currentSong.id}/suggestions?limit=10`;
          const res = await fetch(recUrl);
          if (res.ok) {
            const json = await res.json();
            const recs = json?.data || [];
            if (recs.length > 0) {
              appendNewUniqueSongs(formatSongsData(recs));
              isFetchingRecommendations = false;
              return;
            }
          }
        }

        // Fallback: Fetch more tracks by primary artist name
        const primaryArtist = currentSong.artist.split(/[,&]/)[0].trim();
        const artistSongs = await fetchSongs(primaryArtist);
        if (artistSongs.length > 0) {
          appendNewUniqueSongs(artistSongs);
        }
      } catch (e) {
        console.warn('Failed to load similar songs:', e);
      }
      
      isFetchingRecommendations = false;
    }

    function formatSongsData(items) {
      return items.map(item => {
        let img = '';
        if (Array.isArray(item.image)) {
          img = item.image[item.image.length - 1]?.url || item.image[0]?.url || '';
        } else if (typeof item.image === 'string') {
          img = item.image;
        }

        let audio = '';
        if (Array.isArray(item.downloadUrl)) {
          audio = item.downloadUrl[item.downloadUrl.length - 1]?.url || item.downloadUrl[0]?.url || '';
        } else if (typeof item.url === 'string') {
          audio = item.url;
        }

        return {
          id: item.id || '',
          title: item.name || item.title || 'Unknown Title',
          artist: item.primaryArtists || item.artist || 'Unknown Artist',
          image: img || 'https://via.placeholder.com/150',
          audio: audio
        };
      }).filter(s => s.audio);
    }

    function appendNewUniqueSongs(newSongs) {
      const existingTitles = new Set(currentPlaylist.map(s => s.title.toLowerCase()));
      const uniqueNewSongs = newSongs.filter(s => !existingTitles.has(s.title.toLowerCase()));

      if (uniqueNewSongs.length > 0) {
        currentPlaylist = [...currentPlaylist, ...uniqueNewSongs];
        renderTracks();
        status.textContent = `✨ Added ${uniqueNewSongs.length} similar songs to your queue!`;
      }
    }

    function renderTracks() {
      trackList.innerHTML = '';
      currentPlaylist.forEach((song, index) => {
        const card = document.createElement('div');
        const isActive = index === currentIndex;
        card.className = `track-card ${isActive ? 'active' : ''}`;
        
        card.innerHTML = `
          <img class="track-img" src="${song.image}" alt="${song.title}" />
          <div class="track-info">
            <div class="track-title">${escapeHtml(song.title)}</div>
            <div class="track-artist">${escapeHtml(song.artist)}</div>
          </div>
          <div class="play-badge">${isActive ? '🔊 PLAYING' : '▶'}</div>
        `;

        card.onclick = () => {
          currentIndex = index;
          playSongAtIndex(currentIndex);
          // Automatically pull similar songs in background when a song is tapped
          loadSimilarSongs(song);
        };

        trackList.appendChild(card);
      });
    }

    function playSongAtIndex(index) {
      const song = currentPlaylist[index];
      if (!song) return;

      playerImg.src = song.image;
      playerTitle.textContent = song.title;
      playerArtist.textContent = `▶ ${song.artist}`;
      audioPlayer.src = song.audio;
      playerBar.style.display = 'flex';

      audioPlayer.play().catch(e => console.log('Autoplay policy error:', e));
      renderTracks(); // Update active highlight ring
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Initial search load
    handleSearch();
  </script>
</body>
</html>
