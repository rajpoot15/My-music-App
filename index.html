<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mobile Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #121212; 
      color: #fff; 
      padding: 16px; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    h1 { margin-bottom: 16px; font-size: 22px; text-align: center; color: #1db954; }
    
    .search-box { display: flex; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 14px; }
    .search-box input { flex: 1; padding: 12px 16px; border-radius: 25px; border: none; background: #282828; color: #fff; font-size: 14px; outline: none; }
    .search-box button { padding: 12px 20px; border-radius: 25px; border: none; background: #1db954; color: #000; font-weight: bold; cursor: pointer; }

    .quick-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 500px; margin-bottom: 20px; }
    .tag { background: #282828; color: #aaa; padding: 6px 14px; border-radius: 15px; font-size: 12px; cursor: pointer; border: 1px solid #333; }
    .tag:active { background: #1db954; color: #000; }

    .player-container { width: 100%; max-width: 500px; background: #1e1e1e; border-radius: 12px; padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); border: 1px solid #282828; }
    .now-playing { font-size: 13px; text-align: center; color: #1db954; font-weight: 600; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .iframe-wrapper { position: relative; width: 100%; padding-top: 56.25%; border-radius: 8px; overflow: hidden; background: #000; }
    .iframe-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <h1>🎵 My Music Player</h1>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Enter song name or artist...">
    <button onclick="playSong()">Play</button>
  </div>

  <div class="quick-tags">
    <span class="tag" onclick="quickPlay('Supreme Shubh')">Supreme - Shubh</span>
    <span class="tag" onclick="quickPlay('Karan Aujla hits')">Karan Aujla</span>
    <span class="tag" onclick="quickPlay('Sidhu Moose Wala')">Sidhu Moose Wala</span>
  </div>

  <div class="player-container">
    <div id="nowPlaying" class="now-playing">Playing: Supreme - Shubh</div>
    <div class="iframe-wrapper">
      <iframe id="ytPlayer" src="https://www.youtube-nocookie.com/embed?listType=search&list=Supreme+Shubh" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const ytPlayer = document.getElementById('ytPlayer');
    const nowPlaying = document.getElementById('nowPlaying');

    function playSong() {
      const query = searchInput.value.trim();
      if (!query) return;
      
      nowPlaying.textContent = `Playing: ${query}`;
      ytPlayer.src = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`;
    }

    function quickPlay(songName) {
      searchInput.value = songName;
      playSong();
    }

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') playSong();
    });
  </script>
</body>
</html>
