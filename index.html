<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Music Player</title>
  <style>
    :root { --bg:#121212; --card:#1e1e1e; --primary:#1db954; --text:#fff; --subtext:#b3b3b3; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:var(--bg); color:var(--text); padding:16px; padding-bottom:320px; max-width:600px; margin:0 auto; }
    header { text-align:center; margin-bottom:18px; }
    h1 { color:var(--primary); font-size:1.8rem; }
    .search-box { display:flex; gap:10px; margin-bottom:14px; }
    input[type="text"] { flex:1; padding:12px 16px; border-radius:25px; border:1px solid #333; background:var(--card); color:var(--text); font-size:1rem; outline:none; }
    input[type="text"]:focus { border-color:var(--primary); }
    button.search-btn { padding:12px 20px; border-radius:25px; border:none; background:var(--primary); color:#000; font-weight:bold; font-size:1rem; cursor:pointer; }
    .tags { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; scrollbar-width:none; }
    .tag { background:var(--card); border:1px solid #333; color:var(--subtext); padding:8px 14px; border-radius:20px; white-space:nowrap; font-size:.85rem; cursor:pointer; }
    .status { text-align:center; color:var(--subtext); margin:15px 0 20px; font-size:.9rem; }
    .track-list { display:flex; flex-direction:column; gap:10px; }
    .track-card { display:flex; align-items:center; gap:12px; background:var(--card); padding:10px 14px; border-radius:12px; cursor:pointer; border:1px solid transparent; }
    .track-card.active { background:#18281e; border-color:var(--primary); }
    .track-img { width:54px; height:54px; border-radius:8px; object-fit:cover; }
    .track-info { flex:1; overflow:hidden; }
    .track-title { font-size:.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .track-artist { font-size:.82rem; color:var(--subtext); margin-top:4px; }

    .player-bar { position:fixed; bottom:0; left:0; right:0; background:#181818; border-top:1px solid #282828; padding:12px 16px; display:none; flex-direction:column; gap:10px; max-width:600px; margin:0 auto; }
    .player-header { display:flex; align-items:center; gap:12px; }
    .player-header img { width:48px; height:48px; border-radius:6px; }
    .btn { background:var(--primary); color:#000; border:none; padding:6px 14px; border-radius:15px; font-weight:bold; cursor:pointer; }
    .btn.alt { background:#333; color:#fff; }
    .yt-wrap { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
    .yt-wrap iframe, .yt-wrap > div { position:absolute; inset:0; width:100%; height:100%; }
  </style>
</head>
<body>

  <header><h1>🎵 My Music Player</h1></header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search song or artist..." />
    <button class="search-btn" onclick="handleSearch()">Search</button>
  </div>

  <div class="tags">
    <div class="tag" onclick="loadTrending()">🔥 Trending</div>
    <div class="tag" id="newTag" style="display:none" onclick="loadNew()">🆕 New</div>
    <div class="tag" onclick="loadMyList()">📚 My List</div>
    <div class="tag" onclick="quickSearch('Karan Aujla')">🎤 Karan Aujla</div>
  </div>

  <div id="status" class="status">Initializing player...</div>
  <div id="trackList" class="track-list"></div>

  <div id="playerBar" class="player-bar">
    <div class="player-header">
      <img id="playerImg" src="" alt="Cover" />
      <div style="flex:1; min-width:0;">
        <div id="playerTitle" style="font-weight:bold; font-size:.9rem;"></div>
        <div id="playerArtist" style="color:var(--primary); font-size:.8rem;"></div>
      </div>
      <button class="btn alt" onclick="playPrev()">⏮</button>
      <button class="btn" onclick="playNext()">Next ⏭</button>
    </div>
    <div class="yt-wrap"><div id="ytPlayer"></div></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ====== SETTINGS ======
    const YT_API_KEY = 'YAHAN_APNI_API_KEY_DAALO';
    const REGION = 'IN';             // trending kis desh ka
    const NEW_CHANNEL_IDS = [];      // optional: artist/label channel IDs (UCxxxx...) -> "New" tab ke liye

    let currentPlaylist = [], currentIndex = -1, myList = [];
    let ytPlayer = null, ytReady = false, pendingPlay = null, retryList = [], failStreak = 0;

    const $ = id => document.getElementById(id);
    const searchInput = $('searchInput'), trackList = $('trackList'), status = $('status');
    const playerBar = $('playerBar'), playerImg = $('playerImg');
    const playerTitle = $('playerTitle'), playerArtist = $('playerArtist');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm = s => String(s).toLowerCase().replace(/[^a-z0-9\u0900-\u097f\u0a00-\u0a7f]+/g, ' ').trim();

    // ====== Cache (quota bachane ke liye) ======
    function cacheGet(key, ttl) {
      try { const o = JSON.parse(localStorage.getItem(key) || 'null'); if (o && Date.now() - o.t < ttl) return o.v; } catch (e) {}
      return null;
    }
    function cacheSet(key, v) { try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), v })); } catch (e) {} }
    async function withCache(key, ttl, loader) {
      const hit = cacheGet(key, ttl); if (hit) return hit;
      const v = await loader(); cacheSet(key, v); return v;
    }

    async function ytGet(path, params) {
      const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
      Object.entries({ ...params, key: YT_API_KEY }).forEach(([k, v]) => u.searchParams.set(k, v));
      const r = await fetch(u);
      if (!r.ok) throw new Error('YouTube API ' + r.status);
      return r.json();
    }
    const hasKey = () => !YT_API_KEY.startsWith('YAHAN');
    const thumb = s => (s.thumbnails.medium || s.thumbnails.default || {}).url || '';

    // ====== YouTube player ======
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('ytPlayer', {
        width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => { ytReady = true; if (pendingPlay !== null) playSong(pendingPlay); },
          onStateChange: e => {
            if (e.data === YT.PlayerState.PLAYING) failStreak = 0;
            if (e.data === YT.PlayerState.ENDED) playNext();
          },
          onError: () => tryNextCandidate()
        }
      });
    };

    // ====== Lists: Trending / New / My List / Search ======
    function showList(tracks, msg) {
      currentPlaylist = tracks; currentIndex = -1;
      status.textContent = tracks.length ? `${msg} (${tracks.length}). Tap to play:` : 'Kuch nahi mila.';
      renderTracks();
    }

    // Trending music: 1 unit me 40 songs, 3 ghante cache
    async function loadTrending() {
      if (!hasKey()) { status.textContent = 'Pehle code mein YouTube API key daalo.'; return; }
      status.textContent = 'Loading trending...'; trackList.innerHTML = '';
      try {
        const tracks = await withCache('trend:' + REGION, 3 * 3600e3, async () => {
          const d = await ytGet('videos', { part: 'snippet,status', chart: 'mostPopular', videoCategoryId: '10', regionCode: REGION, maxResults: 40 });
          return d.items.filter(v => v.status.embeddable).map(v => ({ title: v.snippet.title, artist: v.snippet.channelTitle, image: thumb(v.snippet), videoId: v.id }));
        });
        showList(tracks, '🔥 Trending');
      } catch (e) { status.textContent = 'Trending load nahi hua (API key ya quota check karo).'; console.error(e); }
    }

    // New releases: channels ki uploads playlist, 1 unit per channel
    async function loadNew() {
      status.textContent = 'Loading new releases...'; trackList.innerHTML = '';
      try {
        const tracks = await withCache('new:' + NEW_CHANNEL_IDS.join(','), 3 * 3600e3, async () => {
          let all = [];
          for (const ch of NEW_CHANNEL_IDS) {
            const d = await ytGet('playlistItems', { part: 'snippet', playlistId: 'UU' + ch.slice(2), maxResults: 10 });
            all = all.concat(d.items.filter(i => i.snippet.resourceId && !/^(Private|Deleted) video$/.test(i.snippet.title))
              .map(i => ({ title: i.snippet.title, artist: i.snippet.videoOwnerChannelTitle || i.snippet.channelTitle, image: thumb(i.snippet), videoId: i.snippet.resourceId.videoId, at: i.snippet.publishedAt })));
          }
          return all.sort((a, b) => b.at.localeCompare(a.at)).slice(0, 40);
        });
        showList(tracks, '🆕 New');
      } catch (e) { status.textContent = 'New releases load nahi hue.'; console.error(e); }
    }

    // My List: songs.json (quota zero)
    async function loadMyList() {
      const tracks = myList.map(m => ({ ...m, image: m.image || `https://i.ytimg.com/vi/${m.videoId}/mqdefault.jpg` }));
      showList(tracks, '📚 My List');
      if (!tracks.length) status.textContent = 'My List khali hai. songs.json mein songs daalo.';
    }
    fetch('songs.json').then(r => r.json()).then(d => { myList = Array.isArray(d) ? d : []; }).catch(() => {});

    // Search: iTunes se naam/cover
    function quickSearch(q) { searchInput.value = q; handleSearch(); }
    async function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;
      status.textContent = 'Searching...'; trackList.innerHTML = '';
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=25`);
        const data = await res.json();
        const tracks = (data.results || []).map(i => ({
          title: i.trackName || 'Unknown Track', artist: i.artistName || 'Unknown Artist',
          image: (i.artworkUrl100 || '').replace('100x100bb', '300x300bb')
        }));
        showList(tracks, 'Found');
      } catch (e) { status.textContent = 'Network error. Please check your connection.'; }
    }

    function renderTracks() {
      trackList.innerHTML = '';
      currentPlaylist.forEach((song, index) => {
        const card = document.createElement('div');
        card.className = 'track-card' + (index === currentIndex ? ' active' : '');
        card.innerHTML = `
          <img class="track-img" src="${esc(song.image)}" alt="" />
          <div class="track-info">
            <div class="track-title">${esc(song.title)}</div>
            <div class="track-artist">🎤 ${esc(song.artist)}</div>
          </div>`;
        card.onclick = () => playSong(index);
        trackList.appendChild(card);
      });
    }

    // ====== Video ID dhoondhna: My List -> cache -> YouTube search ======
    async function findVideoIds(song) {
      if (song.videoId) return [song.videoId];
      const local = myList.find(m => norm(m.title) === norm(song.title));
      if (local) return [local.videoId];
      const key = 'yt:' + song.title + '|' + song.artist;
      const hit = cacheGet(key, 365 * 864e5); if (hit && hit.length) return hit;
      if (!hasKey()) throw new Error('no key');
      const d = await ytGet('search', { part: 'snippet', type: 'video', videoEmbeddable: 'true', videoCategoryId: '10', maxResults: 5, q: `${song.title} ${song.artist} official audio` });
      const ids = (d.items || []).map(i => i.id.videoId);
      cacheSet(key, ids); return ids;
    }

    // ====== Playback ======
    async function playSong(index) {
      const song = currentPlaylist[index]; if (!song) return;
      currentIndex = index;
      playerImg.src = song.image; playerTitle.textContent = song.title; playerArtist.textContent = song.artist;
      playerBar.style.display = 'flex'; renderTracks();
      if (!ytReady) { pendingPlay = index; status.textContent = 'Loading player...'; return; }
      pendingPlay = null;
      try {
        status.textContent = 'Loading full song...';
        retryList = await findVideoIds(song);
        tryNextCandidate();
      } catch (e) {
        status.textContent = hasKey() ? 'YouTube search fail hua (quota check karo).' : 'Pehle code mein YouTube API key daalo.';
        console.error(e);
      }
    }

    function tryNextCandidate() {
      const id = retryList.shift();
      if (!id) {
        if (++failStreak > 5) { status.textContent = 'Kai songs nahi chale. Internet ya quota check karo.'; return; }
        status.textContent = 'Ye song embed nahi ho sakta. Next chal raha hai...';
        setTimeout(playNext, 1200); return;
      }
      status.textContent = 'Now playing';
      ytPlayer.loadVideoById(id);
    }

    function playNext() { if (currentPlaylist.length) playSong((currentIndex + 1) % currentPlaylist.length); }
    function playPrev() { if (currentPlaylist.length) playSong((currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length); }

    if (NEW_CHANNEL_IDS.length) $('newTag').style.display = '';
    hasKey() ? loadTrending() : (status.textContent = 'Code mein YouTube API key daalo, phir trending songs apne aap aayenge.');
  </script>
</body>
</html>
