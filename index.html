<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Player</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .title {
      color: #10b981;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Search Bar Layout */
    .search-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-btn {
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      background-color: #10b981;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* Top Singer Tags */
    .singer-tags {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      width: 100%;
      max-width: 450px;
      padding-bottom: 10px;
    }

    .singer-chip {
      background-color: #242424;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s;
    }

    .singer-chip:hover {
      background-color: #333333;
    }

    .status-msg {
      margin-top: 30px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="title">🎵 My Music Player</div>

  <!-- Search Input and Button -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search singer or song...">
    <button id="searchBtn" class="search-btn">Search</button>
  </div>

  <!-- Top Singer Chips -->
  <div class="singer-tags">
    <button class="singer-chip" data-artist="Shubh">🔥 Shubh</button>
    <button class="singer-chip" data-artist="Alan Walker">🎧 Alan Walker</button>
    <button class="singer-chip" data-artist="Arijit Singh">🎤 Arijit Singh</button>
    <button class="singer-chip" data-artist="Karan Aujla">👑 Karan Aujla</button>
  </div>

  <!-- Search Status / Results Area -->
  <div id="statusMsg" class="status-msg">Searching network servers...</div>

  <script>
    // DOM Elements
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const statusMsg = document.getElementById("statusMsg");
    const singerChips = document.querySelectorAll(".singer-chip");

    // Search Logic
    function searchSongs(query) {
      if (!query.trim()) return;
      
      // Updates status text
      statusMsg.textContent = `Searching all songs for "${query}"...`;
      
      // Place your actual API / fetch call here:
      /*
      fetch(`YOUR_API_ENDPOINT?artist=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
           // Display songs list
        });
      */
    }

    // Handle Singer Tag Clicks
    singerChips.forEach(chip => {
      chip.addEventListener("click", () => {
        const artistName = chip.getAttribute("data-artist");
        searchInput.value = artistName; // Auto-fill search box
        searchSongs(artistName);        // Trigger search
      });
    });

    // Handle Search Button Click
    searchBtn.addEventListener("click", () => {
      searchSongs(searchInput.value);
    });

    // Handle Enter Key Press in Search Bar
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        searchSongs(searchInput.value);
      }
    });
  </script>

</body>
</html>
